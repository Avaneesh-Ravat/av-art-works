# Production stack: all services + Postgres + Redis + nginx (the `web` image
# serves the built SPA and reverse-proxies /api to the gateway), on a single host.
#
# App images are built in GitHub Actions (linux/arm64) and pulled from GHCR.
# IMAGE_TAG and GHCR_OWNER are set in the server .env by the deploy pipeline.
#
# Images are stored in real AWS S3. The catalog-service reads/writes the bucket
# via the EC2 instance's IAM role (NO AWS keys on disk) and streams public reads
# through /api/v1/media so the bucket can stay private.
#
# Secrets/config are read from a `.env` file in this directory (see .env.example).
# Start with:  docker compose -f docker-compose.prod.yml --env-file .env up -d
name: avartworks

x-common-env: &common-env
  DATABASE_URL: "postgres://avart:${POSTGRES_PASSWORD}@postgres:5432/avartworks?sslmode=disable"
  REDIS_URL: "redis://redis:6379/0"
  JWT_SECRET: "${JWT_SECRET}"
  JWT_ACCESS_TTL: "${JWT_ACCESS_TTL:-15m}"
  JWT_REFRESH_TTL: "${JWT_REFRESH_TTL:-168h}"
  INTERNAL_TOKEN: "${INTERNAL_TOKEN}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: avart
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: avartworks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avart -d avartworks"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  user-service:
    image: ghcr.io/${GHCR_OWNER}/av-art-works-user-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *common-env
      HTTP_ADDR: ":8081"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  catalog-service:
    image: ghcr.io/${GHCR_OWNER}/av-art-works-catalog-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *common-env
      HTTP_ADDR: ":8082"
      # Real AWS S3. No S3_ENDPOINT => uses AWS. No keys => uses the EC2 IAM role.
      S3_BUCKET: "${S3_BUCKET}"
      AWS_REGION: "${AWS_REGION:-ap-south-1}"
      # Public reads are streamed through the API so the bucket stays private and
      # Cloudflare can cache them. Override with a CDN URL if you make the bucket public.
      MEDIA_PUBLIC_BASE_URL: "${MEDIA_PUBLIC_BASE_URL:-/api/v1/media}"
      S3_PRESIGN_TTL: "${S3_PRESIGN_TTL:-15m}"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  order-service:
    image: ghcr.io/${GHCR_OWNER}/av-art-works-order-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *common-env
      HTTP_ADDR: ":8083"
      CATALOG_INTERNAL_URL: "http://catalog-service:8082"
    depends_on:
      postgres: { condition: service_healthy }
      catalog-service: { condition: service_started }

  payment-service:
    image: ghcr.io/${GHCR_OWNER}/av-art-works-payment-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *common-env
      HTTP_ADDR: ":8084"
      ORDER_INTERNAL_URL: "http://order-service:8083"
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET}"
      RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET}"
    depends_on:
      postgres: { condition: service_healthy }
      order-service: { condition: service_started }

  gateway:
    image: ghcr.io/${GHCR_OWNER}/av-art-works-gateway:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *common-env
      HTTP_ADDR: ":8080"
      RATE_LIMIT: "${RATE_LIMIT:-120}"
      RATE_WINDOW: "${RATE_WINDOW:-1m}"
      USER_SERVICE_URL: "http://user-service:8081"
      CATALOG_SERVICE_URL: "http://catalog-service:8082"
      ORDER_SERVICE_URL: "http://order-service:8083"
      PAYMENT_SERVICE_URL: "http://payment-service:8084"
    depends_on:
      redis: { condition: service_healthy }
      user-service: { condition: service_started }
      catalog-service: { condition: service_started }
      order-service: { condition: service_started }
      payment-service: { condition: service_started }

  web:
    image: ghcr.io/${GHCR_OWNER}/av-art-works-web:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      gateway: { condition: service_started }

volumes:
  pgdata:
  redisdata:
