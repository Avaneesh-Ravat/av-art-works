server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed static assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Docker's embedded DNS. Using a variable in proxy_pass forces nginx to
    # re-resolve the gateway hostname on each request instead of caching the
    # IP from container start (otherwise a gateway recreate causes 502s until
    # the web container is restarted).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Reverse-proxy API calls to the gateway so the SPA stays same-origin.
    location /api/ {
        set $gateway_upstream http://gateway:8080;
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
