name: Deploy

# Deploys to the single EC2 host after CI succeeds on main.
# Can also be triggered manually from the Actions tab.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to EC2
    runs-on: ubuntu-latest
    # For workflow_run, only deploy when CI actually passed. Manual runs always proceed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Write production .env
        run: printf '%s' "${{ secrets.PROD_ENV }}" > .env

      - name: Sync repository to the server
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'web/dist' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/avartworks/"

      - name: Build & restart the stack
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          SSH="ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 $SSH_TARGET"

          # Launch the build detached so it survives this SSH session (heavy
          # Go builds on a small box otherwise drop the connection mid-build).
          $SSH 'cd /opt/avartworks && rm -f deploy.exit && chmod +x deploy/remote-up.sh && setsid bash deploy/remote-up.sh > deploy.log 2>&1 < /dev/null & echo launched'

          # Poll for completion with short-lived connections (up to ~20 min).
          for i in $(seq 1 120); do
            sleep 10
            status="$($SSH 'cat /opt/avartworks/deploy.exit 2>/dev/null || echo RUNNING')"
            echo "poll $i: $status"
            if [ "$status" != "RUNNING" ]; then
              echo "=== deploy.log (tail) ==="
              $SSH 'tail -n 40 /opt/avartworks/deploy.log' || true
              echo "=== container status ==="
              $SSH 'cd /opt/avartworks && docker compose -f docker-compose.prod.yml ps' || true
              exit "$status"
            fi
          done
          echo "Timed out waiting for the build to finish"
          exit 1
