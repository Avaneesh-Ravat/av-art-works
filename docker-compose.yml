name: avartworks

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avart
      POSTGRES_PASSWORD: avart_secret
      POSTGRES_DB: avartworks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avart -d avartworks"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      HTTP_ADDR: ":8081"
      DATABASE_URL: "postgres://avart:avart_secret@postgres:5432/avartworks?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "local-dev-secret-change-me"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,*"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
