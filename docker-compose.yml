name: avartworks

x-common-env: &common-env
  DATABASE_URL: "postgres://avart:avart_secret@postgres:5432/avartworks?sslmode=disable"
  REDIS_URL: "redis://redis:6379/0"
  JWT_SECRET: "local-dev-secret-change-me"
  INTERNAL_TOKEN: "local-internal-token"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,*"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avart
      POSTGRES_PASSWORD: avart_secret
      POSTGRES_DB: avartworks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avart -d avartworks"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      <<: *common-env
      HTTP_ADDR: ":8081"
      ADMIN_EMAIL: "admin@avartworks.in"
      ADMIN_PASSWORD: "admin12345"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    environment:
      <<: *common-env
      HTTP_ADDR: ":8082"
      IMAGE_BASE_URL: "http://localhost:8082/uploads"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      <<: *common-env
      HTTP_ADDR: ":8083"
      CATALOG_INTERNAL_URL: "http://catalog-service:8082"
    depends_on:
      postgres: { condition: service_healthy }
      catalog-service: { condition: service_started }

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    environment:
      <<: *common-env
      HTTP_ADDR: ":8084"
      ORDER_INTERNAL_URL: "http://order-service:8083"
      RAZORPAY_KEY_ID: "rzp_test_mockkey"
      RAZORPAY_KEY_SECRET: "mock_key_secret"
      RAZORPAY_WEBHOOK_SECRET: "mock_webhook_secret"
    depends_on:
      postgres: { condition: service_healthy }
      order-service: { condition: service_started }

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      <<: *common-env
      HTTP_ADDR: ":8080"
      USER_SERVICE_URL: "http://user-service:8081"
      CATALOG_SERVICE_URL: "http://catalog-service:8082"
      ORDER_SERVICE_URL: "http://order-service:8083"
      PAYMENT_SERVICE_URL: "http://payment-service:8084"
    ports:
      - "8080:8080"
    depends_on:
      redis: { condition: service_healthy }
      user-service: { condition: service_started }
      catalog-service: { condition: service_started }
      order-service: { condition: service_started }
      payment-service: { condition: service_started }

volumes:
  pgdata:
