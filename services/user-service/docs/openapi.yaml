openapi: 3.0.3
info:
  title: AV Art Works - User Service
  version: 1.0.0
  description: Authentication, profile, address, and role management.
servers:
  - url: http://localhost:8081
paths:
  /api/v1/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                full_name: { type: string }
                phone: { type: string }
      responses:
        "201": { description: Created }
        "409": { description: Email already registered }
  /api/v1/auth/login:
    post:
      summary: Login and receive tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { description: Access + refresh tokens and user }
        "401": { description: Invalid credentials }
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token for a new access token
      responses:
        "200": { description: New token pair }
        "401": { description: Invalid/expired token }
  /api/v1/auth/forgot-password:
    post:
      summary: Request a password reset token (mock email)
      responses:
        "202": { description: Accepted }
  /api/v1/auth/reset-password:
    post:
      summary: Reset password with a token
      responses:
        "200": { description: Updated }
  /api/v1/users/me:
    get:
      summary: Get current user profile
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Profile }
    put:
      summary: Update current user profile
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Updated profile }
  /api/v1/users/me/addresses:
    get:
      summary: List addresses
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Address list }
    post:
      summary: Add an address
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Created }
  /api/v1/admin/users:
    get:
      summary: List all users (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Users }
        "403": { description: Admin access required }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
